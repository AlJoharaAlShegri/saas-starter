# Quality + Dependency-audit jobs assume pnpm + TypeScript (the default stack) - swap those steps per project.
# Semgrep configs are TS/React - adjust per language. Keep SAST / secret scan / audit blocking.
# If job names change, update required checks in .github/rulesets/protect-uat-and-main.json.
name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable pnpm (corepack)
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter app run --if-present lint

      - name: Typecheck
        run: pnpm --filter app exec tsc -b

      - name: Unit tests
        run: pnpm --filter app run --if-present test -- --run

      - name: Build
        run: pnpm --filter app build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/ci
          --config p/typescript
          --config p/react
          --config p/secrets
          --error
          --exclude design
          --exclude '**/dist'

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Audit production dependencies (fail on high+)
        run: pnpm audit --prod --audit-level high
